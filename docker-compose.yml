
services:

  postgres_db:
    image: postgis/postgis:latest
    container_name: postgres_db
    restart: always
    ports:
      - "3001:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=qgd_db
    volumes:
      - postgres-data:/var/lib/postgresql/data


  backend:
    build: ./backend
    depends_on:
      - postgres_db
    container_name: backend
    restart: always
    volumes:
      - ./backend:/code
    ports:
      - 8000:8000
    environment:
      - POSTGRES_URL=jdbc:postgresql://postgres_db:5432/qgd_db
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=admin
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1000M
        reservations:
          cpus: '0.5'
          memory: 1000M

  frontend:
    build: 
      context: ./frontend
      dockerfile: ./Dockerfile
    depends_on:
      - backend
    container_name: frontend
    restart: always
    ports:
      - 3000:3000
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1000M
        reservations:
          cpus: '0.5'
          memory: 1000M

volumes:
  postgres-data: